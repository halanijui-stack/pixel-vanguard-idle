<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Vanguard Idle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #2a2a2a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 1000px; 
            padding: 20px; 
            background: #1a1a1a; 
            border-radius: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-form {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            width: 300px;
        }
        .login-form h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffa500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ffa500;
            border-radius: 5px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255,165,0,0.5);
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffa500, #ff8c00);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-form button:hover {
            background: linear-gradient(135deg, #ffcc00, #ffa500);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,165,0,0.4);
        }
        .login-form button:active {
            transform: translateY(0);
        }
        .game-screen {
            display: none;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #222;
            padding: 15px;
            border-radius: 5px;
            border: 2px solid #ffa500;
        }
        .stat {
            flex: 1;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-label { color: #aaa; font-size: 12px; }
        .stat-value { color: #ffa500; font-weight: bold; font-size: 18px; }
        .battle-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .character, .monster {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 5px;
            border: 2px solid #ffa500;
            text-align: center;
        }
        .sprite {
            font-size: 80px;
            margin-bottom: 10px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hp-bar {
            background: #1a1a1a;
            border: 1px solid #ffa500;
            height: 20px;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .hp-fill {
            background: linear-gradient(90deg, #00ff00, #ffff00);
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .chat-area {
            background: #222;
            border: 2px solid #ffa500;
            border-radius: 5px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .chat-message {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 3px;
            font-size: 14px;
        }
        .chat-message.system { color: #ffff00; }
        .chat-message.player { color: #00ff00; }
        .chat-message.admin { color: #ff0000; font-weight: bold; }
        .chat-input {
            display: flex;
            gap: 5px;
        }
        .chat-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ffa500;
            border-radius: 3px;
            background: #1a1a1a;
            color: #fff;
        }
        .chat-input button {
            padding: 8px 15px;
            background: #ffa500;
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .inventory {
            background: #222;
            border: 2px solid #ffa500;
            border-radius: 5px;
            padding: 15px;
        }
        .inventory-title {
            color: #ffa500;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .inventory-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 3px;
            border: 1px solid #ffa500;
            text-align: center;
            min-width: 80px;
        }
        .item-icon { font-size: 30px; }
        .item-name { font-size: 12px; color: #aaa; }
        .item-qty { color: #ffa500; font-weight: bold; }
        .error { color: #ff4444; font-weight: bold; }
        .success { color: #44ff44; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginScreen" class="login-screen">
            <div class="login-form">
                <h1>⚔️ PIXEL VANGUARD</h1>
                <input type="text" id="nickInput" placeholder="Nick do Herói" maxlength="20">
                <input type="password" id="senhaInput" placeholder="Senha" maxlength="50">
                <button id="enterBtn">ENTRAR NA DUNGEON</button>
                <div id="loginError" style="margin-top: 15px; text-align: center;"></div>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="gameScreen" class="game-screen">
            <h1 style="text-align: center; margin-bottom: 20px; color: #ffa500;">PIXEL VANGUARD IDLE</h1>
            <div id="playerNickDisplay" style="text-align: center; color: #ffa500; margin-bottom: 10px; font-weight: bold;"></div>

            <!-- STATUS DO JOGADOR -->
            <div class="status-bar">
                <div class="stat">
                    <div class="stat-label">LEVEL</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">EXP</div>
                    <div class="stat-value" id="expDisplay">0/100</div>
                </div>
                <div class="stat">
                    <div class="stat-label">GOLD</div>
                    <div class="stat-value" id="goldDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">STAGE</div>
                    <div class="stat-value" id="stageDisplay">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">ATK SPD</div>
                    <div class="stat-value" id="atkSpdDisplay">1.0</div>
                </div>
            </div>

            <!-- ÁREA DE BATALHA -->
            <div class="battle-area">
                <div class="character">
                    <h3>HERÓI</h3>
                    <div class="sprite" id="playerSprite">🗡️</div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="playerHpFill" style="width: 100%;"></div>
                    </div>
                    <div id="playerHpText">100/100 HP</div>
                    <div style="margin-top: 10px; color: #aaa; font-size: 12px;">ATK: <span id="playerAtkDisplay">10</span> | DEF: <span id="playerDefDisplay">2</span></div>
                </div>

                <div class="monster">
                    <h3 id="monsterName">SLIME</h3>
                    <div class="sprite" id="monsterSprite">👾</div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="monsterHpFill" style="width: 100%;"></div>
                    </div>
                    <div id="monsterHpText">100/100 HP</div>
                    <div style="margin-top: 10px; color: #aaa; font-size: 12px;">ATK: <span id="monsterAtkDisplay">5</span> | DEF: <span id="monsterDefDisplay">1</span></div>
                </div>
            </div>

            <!-- CONTROLES -->
            <div class="controls">
                <button class="btn" id="autoFightBtn">⚙️ AUTO FIGHT</button>
                <button class="btn" id="pauseBtn">⏸️ PAUSE</button>
                <button class="btn" id="nextStageBtn">➡️ PRÓXIMO STAGE</button>
            </div>

            <!-- CHAT GLOBAL -->
            <div class="chat-area" id="chatArea"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem..." maxlength="100">
                <button id="sendChatBtn">ENVIAR</button>
            </div>

            <!-- INVENTÁRIO -->
            <div class="inventory">
                <div class="inventory-title">INVENTÁRIO</div>
                <div class="inventory-items" id="inventoryItems">
                    <div class="item">
                        <div class="item-icon">🧪</div>
                        <div class="item-name">HP Potion</div>
                        <div class="item-qty" id="hpPotionQty">0</div>
                    </div>
                    <div class="item">
                        <div class="item-icon">⚡</div>
                        <div class="item-name">MP Potion</div>
                        <div class="item-qty" id="mpPotionQty">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        // CONFIGURAÇÃO SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://your-project.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key-here';
        const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DO DOM
        // ============================================================
        const loginScreen = document.getElementById('loginScreen');
        const gameScreen = document.getElementById('gameScreen');
        const nickInput = document.getElementById('nickInput');
        const senhaInput = document.getElementById('senhaInput');
        const enterBtn = document.getElementById('enterBtn');
        const loginError = document.getElementById('loginError');
        const playerNickDisplay = document.getElementById('playerNickDisplay');
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        // ============================================================
        // ESTADO DO JOGO
        // ============================================================
        let gameState = {
            nick: '',
            level: 1,
            exp: 0,
            expToLevel: 100,
            gold: 0,
            stage: 1,
            atkSpd: 1.0,
            playerHp: 100,
            playerMaxHp: 100,
            playerAtk: 10,
            playerDef: 2,
            monsterHp: 100,
            monsterMaxHp: 100,
            monsterAtk: 5,
            monsterDef: 1,
            hpPotions: 0,
            mpPotions: 0,
            autoFight: false,
            paused: false,
            battleLog: []
        };

        let currentUser = null;

        // ============================================================
        // NOVO FLUXO DE AUTENTICAÇÃO (Supabase Auth + E-mail Fantasma)
        // ============================================================
        enterBtn.addEventListener('click', async () => {
            const nick = nickInput.value.trim();
            const senha = senhaInput.value.trim();

            // Validação básica
            if (!nick || !senha) {
                mostrarErro('Digite nick e senha!');
                return;
            }

            if (nick.length < 3 || nick.length > 20) {
                mostrarErro('Nick deve ter entre 3 e 20 caracteres!');
                return;
            }

            enterBtn.disabled = true;
            loginError.textContent = 'Autenticando...';
            loginError.className = '';

            try {
                const emailFantasma = nick.toLowerCase() + '@pixelvanguard.com';

                // Tentar login primeiro
                const { data: loginData, error: loginError } = await supaClient.auth.signInWithPassword({
                    email: emailFantasma,
                    password: senha
                });

                if (loginError) {
                    // Se falhar por credenciais inválidas, tentar criar conta
                    if (loginError.message.includes('Invalid login credentials')) {
                        // ============================================================
                        // TRAVA DE SEGURANÇA: Bloquear nicks com ADM/GM/CM
                        // ============================================================
                        const nickUpper = nick.toUpperCase();
                        if (nickUpper.includes('ADM') || nickUpper.includes('GM') || nickUpper.includes('CM')) {
                            mostrarErro('Este nick é reservado para admins!');
                            enterBtn.disabled = false;
                            return;
                        }

                        // Criar nova conta com Supabase Auth
                        const { data: signupData, error: signupError } = await supaClient.auth.signUp({
                            email: emailFantasma,
                            password: senha,
                            options: {
                                data: {
                                    nick: nick
                                }
                            }
                        });

                        if (signupError) {
                            mostrarErro('Erro ao criar conta: ' + signupError.message);
                            enterBtn.disabled = false;
                            return;
                        }

                        // SignUp bem-sucedido, fazer login automático
                        currentUser = signupData.user;
                        gameState.nick = nick;
                        iniciarJogo();
                    } else {
                        mostrarErro('Erro: ' + loginError.message);
                        enterBtn.disabled = false;
                    }
                } else {
                    // Login bem-sucedido
                    currentUser = loginData.user;
                    gameState.nick = nick;
                    iniciarJogo();
                }
            } catch (err) {
                mostrarErro('Erro na autenticação: ' + err.message);
                enterBtn.disabled = false;
            }
        });

        function mostrarErro(msg) {
            loginError.textContent = msg;
            loginError.className = 'error';
        }

        // ============================================================
        // INICIAR JOGO
        // ============================================================
        async function iniciarJogo() {
            // Buscar game_data na tabela public.users usando o nick
            const { data: userData, error: userError } = await supaClient
                .from('users')
                .select('*')
                .eq('nick', gameState.nick)
                .single();

            if (userError) {
                mostrarErro('Erro ao carregar dados do jogo: ' + userError.message);
                enterBtn.disabled = false;
                return;
            }

            // Restaurar estado do jogo a partir do banco de dados
            if (userData) {
                gameState = {
                    ...gameState,
                    level: userData.level || 1,
                    exp: userData.exp || 0,
                    expToLevel: userData.exp_to_level || 100,
                    gold: userData.gold || 0,
                    stage: userData.stage || 1,
                    atkSpd: userData.atk_spd || 1.0,
                    playerHp: userData.player_hp || 100,
                    playerMaxHp: userData.player_max_hp || 100,
                    playerAtk: userData.player_atk || 10,
                    playerDef: userData.player_def || 2,
                    hpPotions: userData.hp_potions || 0,
                    mpPotions: userData.mp_potions || 0
                };
            }

            // Esconder login e mostrar jogo
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            playerNickDisplay.textContent = `Jogador: ${gameState.nick}`;

            // Inicializar monstro e UI
            gerarMonstro();
            atualizarUI();
            adicionarMensagemChat('system', `${gameState.nick} entrou na dungeon!`);

            // Iniciar loop do idle
            setInterval(executarTurno, 1000);
        }

        // ============================================================
        // LÓGICA DO JOGO (Idle / Auto-Battle)
        // ============================================================
        function gerarMonstro() {
            const baseHp = 30 * Math.pow(1.35, gameState.stage - 1);
            const baseAtk = 5 * Math.pow(1.35, gameState.stage - 1);
            const baseDef = 1 * Math.pow(1.28, gameState.stage - 1);

            gameState.monsterMaxHp = Math.ceil(baseHp);
            gameState.monsterHp = gameState.monsterMaxHp;
            gameState.monsterAtk = Math.ceil(baseAtk);
            gameState.monsterDef = Math.ceil(baseDef);
        }

        function executarTurno() {
            if (gameState.paused || gameState.playerHp <= 0) return;

            const playerAttacks = Math.max(1, Math.floor(gameState.atkSpd));
            const monsterAttacks = 1;

            // Jogador ataca
            for (let i = 0; i < playerAttacks; i++) {
                const dano = Math.max(1, gameState.playerAtk - gameState.monsterDef + Math.random() * 5);
                gameState.monsterHp -= dano;
                adicionarMensagemChat('system', `${gameState.nick} causou ${dano.toFixed(0)} de dano!`);

                if (gameState.monsterHp <= 0) {
                    vencerBatalha();
                    return;
                }
            }

            // Monstro ataca
            const danoMonstro = Math.max(1, gameState.monsterAtk - gameState.playerDef + Math.random() * 5);
            gameState.playerHp -= danoMonstro;

            if (gameState.playerHp < 0) gameState.playerHp = 0;

            adicionarMensagemChat('system', `Monstro causou ${danoMonstro.toFixed(0)} de dano!`);

            if (gameState.playerHp <= 0) {
                perderBatalha();
            }

            atualizarUI();
        }

        function vencerBatalha() {
            const expGanho = Math.ceil(50 * Math.pow(1.25, gameState.stage - 1));
            const goldGanho = Math.ceil(10 * Math.pow(1.25, gameState.stage - 1));

            gameState.exp += expGanho;
            gameState.gold += goldGanho;

            adicionarMensagemChat('system', `✨ Vitória! +${expGanho} EXP, +${goldGanho} GOLD`);

            if (gameState.exp >= gameState.expToLevel) {
                subirLevel();
            }

            // Regenerar para próxima batalha
            gameState.playerHp = gameState.playerMaxHp;
            gerarMonstro();
            atualizarUI();
            salvarProgresso();
        }

        function perderBatalha() {
            adicionarMensagemChat('system', '💀 Você foi derrotado!');
            gameState.playerHp = gameState.playerMaxHp;
            gerarMonstro();
            atualizarUI();
            salvarProgresso();
        }

        function subirLevel() {
            gameState.level++;
            gameState.exp = 0;
            gameState.expToLevel = Math.ceil(100 * Math.pow(1.1, gameState.level - 1));
            gameState.playerMaxHp += 20;
            gameState.playerHp = gameState.playerMaxHp;
            gameState.playerAtk += 5;
            gameState.playerDef += 1;

            adicionarMensagemChat('system', `🎉 LEVEL UP! Agora você é nível ${gameState.level}!`);
            atualizarUI();
            salvarProgresso();
        }

        function atualizarUI() {
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('expDisplay').textContent = `${gameState.exp}/${gameState.expToLevel}`;
            document.getElementById('goldDisplay').textContent = gameState.gold;
            document.getElementById('stageDisplay').textContent = gameState.stage;
            document.getElementById('atkSpdDisplay').textContent = gameState.atkSpd.toFixed(1);

            // Player
            document.getElementById('playerHpFill').style.width = `${(gameState.playerHp / gameState.playerMaxHp) * 100}%`;
            document.getElementById('playerHpText').textContent = `${Math.ceil(gameState.playerHp)}/${gameState.playerMaxHp} HP`;
            document.getElementById('playerAtkDisplay').textContent = gameState.playerAtk;
            document.getElementById('playerDefDisplay').textContent = gameState.playerDef;

            // Monster
            document.getElementById('monsterHpFill').style.width = `${(gameState.monsterHp / gameState.monsterMaxHp) * 100}%`;
            document.getElementById('monsterHpText').textContent = `${Math.ceil(gameState.monsterHp)}/${gameState.monsterMaxHp} HP`;
            document.getElementById('monsterAtkDisplay').textContent = gameState.monsterAtk;
            document.getElementById('monsterDefDisplay').textContent = gameState.monsterDef;

            // Inventário
            document.getElementById('hpPotionQty').textContent = gameState.hpPotions;
            document.getElementById('mpPotionQty').textContent = gameState.mpPotions;
        }

        // ============================================================
        // CONTROLES DO JOGO
        // ============================================================
        document.getElementById('autoFightBtn').addEventListener('click', () => {
            gameState.autoFight = !gameState.autoFight;
            document.getElementById('autoFightBtn').style.opacity = gameState.autoFight ? '1' : '0.6';
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            gameState.paused = !gameState.paused;
            document.getElementById('pauseBtn').style.opacity = gameState.paused ? '1' : '0.6';
        });

        document.getElementById('nextStageBtn').addEventListener('click', () => {
            gameState.stage++;
            gameState.playerHp = gameState.playerMaxHp;
            gerarMonstro();
            atualizarUI();
            salvarProgresso();
        });

        // ============================================================
        // CHAT GLOBAL
        // ============================================================
        sendChatBtn.addEventListener('click', enviarMensagem);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensagem();
        });

        async function enviarMensagem() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            chatInput.value = '';

            try {
                await supaClient
                    .from('chat_messages')
                    .insert([
                        {
                            nick: gameState.nick,
                            message: msg,
                            created_at: new Date().toISOString()
                        }
                    ]);

                adicionarMensagemChat('player', `${gameState.nick}: ${msg}`);
            } catch (err) {
                console.error('Erro ao enviar mensagem:', err);
            }
        }

        function adicionarMensagemChat(tipo, msg) {
            const msgEl = document.createElement('div');
            msgEl.className = `chat-message ${tipo}`;
            msgEl.textContent = msg;
            chatArea.appendChild(msgEl);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ============================================================
        // PERSISTÊNCIA DE DADOS
        // ============================================================
        async function salvarProgresso() {
            if (!currentUser) return;

            try {
                await supaClient
                    .from('users')
                    .update({
                        level: gameState.level,
                        exp: gameState.exp,
                        exp_to_level: gameState.expToLevel,
                        gold: gameState.gold,
                        stage: gameState.stage,
                        atk_spd: gameState.atkSpd,
                        player_hp: gameState.playerHp,
                        player_max_hp: gameState.playerMaxHp,
                        player_atk: gameState.playerAtk,
                        player_def: gameState.playerDef,
                        hp_potions: gameState.hpPotions,
                        mp_potions: gameState.mpPotions
                    })
                    .eq('nick', gameState.nick);
            } catch (err) {
                console.error('Erro ao salvar progresso:', err);
            }
        }

        // Salvar progresso a cada 30 segundos
        setInterval(salvarProgresso, 30000);

        // Salvar ao sair
        window.addEventListener('beforeunload', salvarProgresso);
    </script>
</body>
</html>
