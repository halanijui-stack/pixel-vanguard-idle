<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Vanguard Idle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #2a2a2a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 1000px; 
            padding: 20px; 
            background: #1a1a1a; 
            border-radius: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-form {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            width: 300px;
        }
        .login-form h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffa500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ffa500;
            border-radius: 5px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255,165,0,0.5);
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffa500, #ff8c00);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-form button:hover {
            background: linear-gradient(135deg, #ffcc00, #ffa500);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,165,0,0.4);
        }
        .login-form button:active {
            transform: translateY(0);
        }
        .game-screen {
            display: none;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #222;
            padding: 15px;
            border-radius: 5px;
            border: 2px solid #ffa500;
        }
        .stat {
            flex: 1;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-label { color: #aaa; font-size: 12px; }
        .stat-value { color: #ffa500; font-weight: bold; font-size: 18px; }
        .battle-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .character, .monster {
            flex: 1;
            background: #222;
            padding: 20px;
            border-radius: 5px;
            border: 2px solid #ffa500;
            text-align: center;
        }
        .sprite {
            font-size: 80px;
            margin-bottom: 10px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hp-bar {
            background: #1a1a1a;
            border: 1px solid #ffa500;
            height: 20px;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .hp-fill {
            background: linear-gradient(90deg, #00ff00, #ffff00);
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .chat-area {
            background: #222;
            border: 2px solid #ffa500;
            border-radius: 5px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .chat-message {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 3px;
            font-size: 14px;
        }
        .chat-message.system { color: #ffff00; }
        .chat-message.player { color: #00ff00; }
        .chat-message.admin { color: #ff0000; font-weight: bold; }
        .chat-input {
            display: flex;
            gap: 5px;
        }
        .chat-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ffa500;
            border-radius: 3px;
            background: #1a1a1a;
            color: #fff;
        }
        .chat-input button {
            padding: 8px 15px;
            background: #ffa500;
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .inventory {
            background: #222;
            border: 2px solid #ffa500;
            border-radius: 5px;
            padding: 15px;
        }
        .inventory-title {
            color: #ffa500;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .inventory-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 3px;
            border: 1px solid #ffa500;
            text-align: center;
            min-width: 80px;
        }
        .item-icon { font-size: 30px; }
        .item-name { font-size: 12px; color: #aaa; }
        .item-qty { color: #ffa500; font-weight: bold; }
        .error { color: #ff4444; font-weight: bold; }
        .success { color: #44ff44; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginScreen" class="login-screen">
            <div class="login-form">
                <h1>⚔️ PIXEL VANGUARD</h1>
                <input type="text" id="nickInput" placeholder="Nick do Herói" maxlength="20">
                <input type="password" id="senhaInput" placeholder="Senha" maxlength="50">
                <button id="enterBtn">ENTRAR NA DUNGEON</button>
                <div id="loginError" style="margin-top: 15px; text-align: center;"></div>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="gameScreen" class="game-screen">
            <h1 style="text-align: center; margin-bottom: 20px; color: #ffa500;">PIXEL VANGUARD IDLE</h1>
            <div id="playerNickDisplay" style="text-align: center; color: #ffa500; margin-bottom: 10px; font-weight: bold;"></div>

            <!-- STATUS DO JOGADOR -->
            <div class="status-bar">
                <div class="stat">
                    <div class="stat-label">LEVEL</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">EXP</div>
                    <div class="stat-value" id="expDisplay">0/100</div>
                </div>
                <div class="stat">
                    <div class="stat-label">GOLD</div>
                    <div class="stat-value" id="goldDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">STAGE</div>
                    <div class="stat-value" id="stageDisplay">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">ATK SPD</div>
                    <div class="stat-value" id="atkSpdDisplay">1.0</div>
                </div>
            </div>

            <!-- ÁREA DE BATALHA -->
            <div class="battle-area">
                <div class="character">
                    <h3>HERÓI</h3>
                    <div class="sprite" id="playerSprite">🗡️</div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="playerHpFill" style="width: 100%;"></div>
                    </div>
                    <div id="playerHpText">100/100 HP</div>
                    <div style="margin-top: 10px; color: #aaa; font-size: 12px;">ATK: <span id="playerAtkDisplay">10</span> | DEF: <span id="playerDefDisplay">2</span></div>
                </div>

                <div class="monster">
                    <h3 id="monsterName">SLIME</h3>
                    <div class="sprite" id="monsterSprite">👾</div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="monsterHpFill" style="width: 100%;"></div>
                    </div>
                    <div id="monsterHpText">100/100 HP</div>
                    <div style="margin-top: 10px; color: #aaa; font-size: 12px;">ATK: <span id="monsterAtkDisplay">5</span> | DEF: <span id="monsterDefDisplay">1</span></div>
                </div>
            </div>

            <!-- CONTROLES -->
            <div class="controls">
                <button class="btn" id="autoFightBtn">⚙️ AUTO FIGHT</button>
                <button class="btn" id="pauseBtn">⏸️ PAUSE</button>
                <button class="btn" id="nextStageBtn">➡️ PRÓXIMO STAGE</button>
            </div>

            <!-- CHAT GLOBAL -->
            <div class="chat-area" id="chatArea"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem..." maxlength="100">
                <button id="sendChatBtn">ENVIAR</button>
            </div>

            <!-- INVENTÁRIO -->
            <div class="inventory">
                <div class="inventory-title">INVENTÁRIO</div>
                <div class="inventory-items" id="inventoryItems">
                    <div class="item">
                        <div class="item-icon">🧪</div>
                        <div class="item-name">HP Potion</div>
                        <div class="item-qty" id="hpPotionQty">0</div>
                    </div>
                    <div class="item">
                        <div class="item-icon">⚡</div>
                        <div class="item-name">MP Potion</div>
                        <div class="item-qty" id="mpPotionQty">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        // CONFIGURAÇÃO SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://aeghxfcoxjknsqgmtrin.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlZ2h4ZmNveGprbnNxZ210cmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODE3MDksImV4cCI6MjEwMDI1NzcwOX0.4GiW7gswQrkl1SpGH8i227o0HeonokInpBPW8mJSAk8';
        const supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ELEMENTOS DO DOM
        // ============================================================
        const loginScreen = document.getElementById('loginScreen');
        const gameScreen = document.getElementById('gameScreen');
        const nickInput = document.getElementById('nickInput');
        const senhaInput = document.getElementById('senhaInput');
        const enterBtn = document.getElementById('enterBtn');
        const loginError = document.getElementById('loginError');
        const playerNickDisplay = document.getElementById('playerNickDisplay');
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        // ============================================================
        // ESTADO DO JOGO
        // ============================================================
        let gameState = {
            nick: '',
            level: 1,
            exp: 0,
            expToLevel: 100,
            gold: 0,
            stage: 1,
            atkSpd: 1.0,
            playerHp: 100,
            playerMaxHp: 100,
            playerAtk: 10,
            playerDef: 2,
            monsterHp: 100,
            monsterMaxHp: 100,
            monsterAtk: 5,
            monsterDef: 1,
            hpPotions: 0,
            mpPotions: 0,
            autoFight: false,
            paused: false,
            battleLog: []
        };

        let currentUser = null;

        // ============================================================
        // NOVO FLUXO DE AUTENTICAÇÃO (Supabase Auth + E-mail Fantasma)
        // ============================================================
        enterBtn.addEventListener('click', async () => {
            const nick = nickInput.value.trim();
            const senha = senhaInput.value.trim();

            // Validação básica
            if (!nick || !senha) {
                mostrarErro('Digite nick e senha!');
                return;
            }

            if (nick.length < 3 || nick.length > 20) {
                mostrarErro('Nick deve ter entre 3 e 20 caracteres!');
                return;
            }

            enterBtn.disabled = true;
            loginError.textContent = 'Autenticando...';
            loginError.className = '';

            try {
                const emailFantasma = nick.toLowerCase() + '@pixelvanguard.com';

                // Tentar login primeiro
                const { data: loginData, error: loginError } = await supaClient.auth.signInWithPassword({
                    email: emailFantasma,
                    password: senha
                });

                if (loginError) {
                    // Se falhar por credenciais inválidas, tentar criar conta
                    if (loginError.message.includes('Invalid login credentials')) {
                        // ============================================================
                        // TRAVA DE SEGURANÇA: Bloquear nicks com ADM/GM/CM
                        // ============================================================
                        const nickUpper = nick.toUpperCase();
                        if (nickUpper.includes('ADM') || nickUpper.includes('GM') || nickUpper.includes('CM')) {
                            mostrarErro('Este nick é reservado para admins!');
                            enterBtn.disabled = false;
                            return;
                        }

                        // Criar nova conta com Supabase Auth
                        const { data: signupData, error: signupError } = await supaClient.auth.signUp({
                            email: emailFantasma,
                            password: senha,
                            options: {
                                data: {
                                    nick: nick
                                }
                            }
                        });

                        if (signupError) {
                            mostrarErro('Erro ao criar conta: ' + signupError.message);
                            enterBtn.disabled = false;
                            return;
                        }

                        // SignUp bem-sucedido, fazer login automático
                        currentUser = signupData.user;
                        gameState.nick = nick;
                        iniciarJogo();
                    } else {
                        mostrarErro('Erro: ' + loginError.message);
                        enterBtn.disabled = false;
                    }
                } else {
                    // Login bem-sucedido
                    currentUser = loginData.user;
                    gameState.nick = nick;
                    iniciarJogo();
                }
            } catch (err) {
                mostrarErro('Erro na autenticação: ' + err.message);
                enterBtn.disabled = false;
            }
        });

        function mostrarErro(msg) {
            loginError.textContent = msg;
            loginError.className = 'error';
        }

        // ============================================================
        // INICIAR JOGO
        // ============================================================
        async function iniciarJogo() {
            // Buscar game_data na tabela public.users usando o nick
            const { data: userData, error: userError } = await supaClient
                .from('users')
                .select('*')
                .eq('nick', gameState.nick)
                .single();

            if (userError) {
                mostrarErro('Erro ao carregar dados do jogo: ' + userError.message);
                enterBtn.disabled = false;
                return;
            }

            // Restaurar estado do jogo a partir do banco de dados
            if (userData) {
                gameState = {
                    ...gameState,
                    level: userData.level || 1,
                    exp: userData.exp || 0,
